# Database for local development (see docs/adr/0003-postgresql-with-podman.md)
# Start:  podman compose up -d
# Stop:   podman compose down   (the data stays in the volume)
#
# Optional Prometheus, Tempo and Grafana (ADR 0019), only with the profile:
#   podman compose --profile observability up -d
#   Grafana: http://localhost:3000 (no sign-in), Prometheus: http://localhost:9090
# Same configuration as on the NAS, from deploy/observability/
services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # From Postgres 18 on the data directory is versioned under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=500MB
      # Tempo writes span metrics and the service graph into Prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  tempo:
    image: docker.io/grafana/tempo:3.1.0
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    # The named volume belongs to root; Tempo would otherwise run as user 10001
    user: "0"
    ports:
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.3.0
    profiles: [observability]
    environment:
      # Local only: no login, everyone is admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Alert rules need a recipient; locally no SMTP, alerts show up in the UI only
      ALERT_EMAIL: alerts@localhost
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  tempo-data:
  grafana-data:
