# Datenbank für die lokale Entwicklung (siehe docs/adr/0003-postgresql-mit-podman.md)
# Starten:  podman compose up -d
# Stoppen:  podman compose down   (Daten bleiben im Volume erhalten)
services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Ab Postgres 18 liegt das Datenverzeichnis versioniert unter /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
