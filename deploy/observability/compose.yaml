# Prometheus, Tempo and Grafana for the app's metrics and traces (ADR 0019).
# TrueNAS 25.10: Apps → Discover Apps → ⋮ → Install via YAML (see deploy/README.md,
# "Metrics and traces"). Replace /mnt/POOL/apps/observability with your dataset.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever comes first: 90 days or 2 GB (ADR 0019)
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
      # Tempo writes span metrics and the service graph into Prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - /mnt/POOL/apps/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/POOL/apps/observability/prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      # OTLP over HTTP: the app sends its traces here (OTEL_EXPORTER_OTLP_ENDPOINT)
      - "4318:4318"
    volumes:
      - /mnt/POOL/apps/observability/tempo.yaml:/etc/tempo.yaml:ro
      - /mnt/POOL/apps/observability/tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Admin password, SMTP for alert e-mails, ALERT_EMAIL (see grafana.env.example)
    env_file:
      - /mnt/POOL/apps/observability/grafana.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - /mnt/POOL/apps/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - /mnt/POOL/apps/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /mnt/POOL/apps/observability/grafana-data:/var/lib/grafana
