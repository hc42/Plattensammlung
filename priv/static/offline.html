<!DOCTYPE html>
<!-- Shown by the service worker (sw.js) when a page can't be loaded. Self-contained:
     without network nothing else can be loaded. In both languages, as the server
     can't pick one. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Plattensammlung</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; text-align: center;
        background: #fbf9f6; color: #2a2522;
      }
      @media (prefers-color-scheme: dark) { body { background: #1f1c1a; color: #efeae4; } }
      .record {
        width: 6rem; height: 6rem; margin: 0 auto 1.5rem; border-radius: 50%;
        background: radial-gradient(circle, #f6f1ea 0 5%, #cf5a2c 5% 33%, #0f0d0c 33%);
      }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: .25rem 0; opacity: .75; }
      a { display: inline-block; margin-top: 1.5rem; padding: .6rem 1.2rem; border-radius: .5rem;
          background: #c4552b; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="record" aria-hidden="true"></div>
      <h1>Keine Verbindung · No connection</h1>
      <p>Die Plattensammlung ist gerade nicht erreichbar.</p>
      <p>The record collection can't be reached right now.</p>
      <!-- href="": the page that could not be loaded, not offline.html -->
      <a href="">Erneut versuchen · Try again</a>
    </main>
  </body>
</html>
